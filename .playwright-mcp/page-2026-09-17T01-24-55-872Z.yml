            - text: 小白定义
          - paragraph [ref=e126]: ReAct = Reasoning + Acting：模型先思考（该做什么）→ 行动（调工具）→ 观察结果，循环到得出答案。Agent 的基本运行节拍——提示词格式、终止条件、轨迹管理是实操三件套。
        - generic [ref=e127]:
          - generic [ref=e128]:
            - generic [ref=e129]: 🎯
            - text: 生活类比
          - generic [ref=e130]:
            - generic [ref=e131]: 🔍
            - generic [ref=e132]:
              - generic [ref=e133]: 类比 1：侦探查案
              - paragraph [ref=e134]: ReAct 是侦探的破案节奏：思考（先查访客记录）→ 行动（调出名单）→ 观察（三个可疑人员）→ 再思考（查第一个的行踪）→ 再行动……推理决定行动，行动结果修正推理。只思考是纸上谈兵，只行动是无头苍蝇——交替才破案。
          - generic [ref=e135]:
            - generic [ref=e136]: 🍳
            - generic [ref=e137]:
              - generic [ref=e138]: 类比 2：照菜谱做新菜
              - paragraph [ref=e139]: 想一步（该焯水了）→ 做一步（真焯水）→ 看一眼（水变色了）→ 再想下一步。菜谱（提示词）给大方向，每步调整靠边看边想。让 LLM 把思考写出来再行动，就是给它装了这个节奏。
